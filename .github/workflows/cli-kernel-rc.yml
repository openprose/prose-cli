name: Build unsigned kernel release candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact X.Y.Z-rc.N version; builds only, no publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cli-kernel-rc-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.15'
          enable-cache: false
      - name: Prepare pinned Python on every architecture
        run: |
          uv python install 3.10.20
          uv venv --python 3.10.20 --seed "$RUNNER_TEMP/distribution-python"
          echo "$RUNNER_TEMP/distribution-python/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: '1.3.5'
          # Match the standalone target so isolated x64 builds do not fetch a
          # second Bun runtime after the rehearsal disables network access.
          bun-download-url: ${{ matrix.os == 'ubuntu-22.04' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-linux-x64-baseline.zip' || matrix.os == 'macos-15-intel' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-darwin-x64-baseline.zip' || '' }}
      - name: Prepare locked toolchains and dependencies
        run: |
          # Bun 1.3.5 treats Darwin x64 baseline as a cross-compile target even
          # when the installed compiler is that baseline runtime. Its pinned
          # resolver checks this exact cwd filename before attempting a fetch.
          if [ "$RUNNER_OS" = macOS ] && [ "$RUNNER_ARCH" = X64 ]; then
            cp "$(command -v bun)" cli/bun/bun-darwin-x64-baseline-v1.3.5
          fi
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          cargo fetch --locked --manifest-path cli/rust/Cargo.toml
          python3 -m pip install --require-hashes --only-binary=:all: -r cli/ci/requirements-test.txt
          cd cli/bun
          bun install --frozen-lockfile --ignore-scripts
      - name: Test kernel RC build guards
        run: |
          python3 -m unittest discover -s cli/ci -p test_build_kernel_rc.py
          python3 -m unittest discover -s cli/ci -p test_check_published_release.py
      - name: Build and verify fresh standalone and npm installations
        env:
          RC_VERSION: ${{ inputs.version || '0.15.0-rc.1' }}
        run: python3 cli/ci/build_kernel_rc.py --version "$RC_VERSION" --out "$RUNNER_TEMP/kernel-rc"
      - uses: Homebrew/actions/setup-homebrew@dc7099b3e807f1e2ecc61f3ecabc840eedd5586a
      - name: Rehearse Homebrew against these exact release archives
        env:
          RC_VERSION: ${{ inputs.version || '0.15.0-rc.1' }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/distribution-python/bin/python3" cli/ci/homebrew_rehearsal.py \
            --kernel-rc "$RUNNER_TEMP/kernel-rc" \
            --expected-source "$EXPECTED_SOURCE" --expected-version "$RC_VERSION" \
            --output "$RUNNER_TEMP/kernel-rc/homebrew"
      - name: Retain packages and offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-kernel-rc-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/kernel-rc/package
            ${{ runner.temp }}/kernel-rc/logs
            ${{ runner.temp }}/kernel-rc/build-report.json
            ${{ runner.temp }}/kernel-rc/homebrew
          retention-days: 14
          if-no-files-found: warn
