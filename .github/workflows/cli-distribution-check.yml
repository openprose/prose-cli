name: CLI distribution rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-distribution-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the approved distribution license
        run: |
          if [ ! -f LICENSE ]; then
            echo '::error::Root LICENSE is missing. Restore the approved license before packaging.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.15'
          enable-cache: false
      - name: Prepare pinned Python on every architecture
        run: |
          uv python install 3.10.20
          uv venv --python 3.10.20 --seed "$RUNNER_TEMP/distribution-python"
          echo "$RUNNER_TEMP/distribution-python/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: '1.3.5'
          # Match the standalone target so isolated x64 builds do not fetch a
          # second Bun runtime after the rehearsal disables network access.
          bun-download-url: ${{ matrix.os == 'ubuntu-22.04' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-linux-x64-baseline.zip' || matrix.os == 'macos-15-intel' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-darwin-x64-baseline.zip' || '' }}
      - name: Prepare locked toolchains and dependencies
        run: |
          # Bun 1.3.5 treats Darwin x64 baseline as a cross-compile target even
          # when the installed compiler is that baseline runtime. Its pinned
          # resolver checks this exact cwd filename before attempting a fetch.
          if [ "$RUNNER_OS" = macOS ] && [ "$RUNNER_ARCH" = X64 ]; then
            cp "$(command -v bun)" bun-darwin-x64-baseline-v1.3.5
          fi
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          cargo fetch --locked --manifest-path cli/rust/Cargo.toml
          python3 -m pip install --require-hashes --only-binary=:all: -r cli/ci/requirements-test.txt
          cd cli/bun
          bun install --frozen-lockfile --ignore-scripts
      - name: Check the public surface
        # prose-cli is a public user client: no internal service detail or
        # developer-only surface in tracked files, release help or binaries.
        # Same check as the public-surface gate in cli/ci/run_local.py.
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 -m unittest discover -s cli/ci -p test_check_public_surface.py
          python3 cli/ci/check_public_surface.py --build-release
      - name: Check hosted service parity between the Rust and Bun ports
        # One shared corpus drives both ports through the test-seam fixture
        # transport; no network. Same checks as the service-* and
        # registry-service-* gates in cli/ci/run_local.py.
        if: matrix.os == 'ubuntu-22.04'
        run: >-
          python3 cli/ci/run_local.py
          --only shared-contracts
          --only service-operations-corpus
          --only service-coverage
          --only service-help
          --only service-operations-rust-build
          --only service-operations-rust
          --only registry-service-rust
          --only service-operations-bun-build
          --only service-operations-bun
          --only registry-service-bun
      - name: Build and test the developer endpoint build
        # The dev-endpoint cargo feature is never in a public build; keep it
        # compiling and tested. Same checks as the rust-build-dev-endpoint and
        # rust-tests-dev-endpoint gates in cli/ci/run_local.py.
        if: matrix.os == 'ubuntu-22.04'
        run: python3 cli/ci/run_local.py --only rust-build-dev-endpoint --only rust-tests-dev-endpoint
      - name: Test distribution plan adapter
        run: |
          python3 -m unittest discover -s cli/conformance/runner -p test_runner.py
          python3 -m unittest discover -s cli/ci -p test_distribution_plan.py
          python3 -m unittest discover -s cli/ci -p test_npm_identity.py
          python3 -m unittest discover -s cli/ci -p test_publication.py
          python3 -m unittest discover -s cli/ci -p test_stage_upload.py
          python3 -m unittest discover -s cli/ci -p test_assemble_kernel_rc.py
          python3 -m unittest discover -s cli/ci -p test_kernel_rc_evidence.py
          python3 -m unittest discover -s cli/ci -p test_sign_macos.py
          python3 -m unittest discover -s cli/ci -p test_rehearse_npm_identity.py
      - name: Build, package and exercise fresh standalone and npm installations
        run: python3 cli/ci/rehearse_release.py --output "$RUNNER_TEMP/cli-rehearsal" --trials 1
      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-rehearsal-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-rehearsal
          retention-days: 14
          if-no-files-found: warn
