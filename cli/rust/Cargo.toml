[workspace]
members = [
  "crates/prose-cli",
  "crates/prose-process-supervisor",
  "crates/prose-runner-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/openprose/prose"

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.9"
rustix = { version = "1.1.4", features = ["process", "std"] }
signal-hook = { version = "0.4.4", default-features = false }
tempfile = "3.20.0"
toml = "0.8.22"
uuid = { version = "1.16.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
