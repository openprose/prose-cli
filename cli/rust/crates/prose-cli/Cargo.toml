[package]
name = "prose-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "prose"
path = "src/main.rs"

[features]
default = []
test-seams = ["prose-runner-core/test-seams"]
# Developer builds only (see README): honour the endpoint override variable.
dev-endpoint = ["prose-runner-core/dev-endpoint"]

[dependencies]
prose-runner-core = { path = "../prose-runner-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["fs"] }
signal-hook.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
