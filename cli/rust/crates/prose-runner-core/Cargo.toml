[package]
name = "prose-runner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-seams = []
# Developer builds only: the service origin can be overridden at runtime.
# Never part of a public build.
dev-endpoint = []

[dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
chrono.workspace = true
prose-process-supervisor = { path = "../prose-process-supervisor" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "net", "fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
